on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"

      - name: Check lint
        run: black --check src/aidflow

      - name: Check syntax
        run: ruff check src/aidflow --select E9

      - name: Compile Python sources
        run: python -m compileall -q src/aidflow

      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build

      - name: Verify wheel is importable
        run: |
          WHEEL=$(ls dist/aidflow-*.whl | head -1)
          python -m pip install "$WHEEL" --force-reinstall --no-deps
          python -c "import aidflow; print(f'aidflow {aidflow.__version__} OK')"
